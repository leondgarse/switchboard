[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "switchboard-room"
dynamic = ["version"]
description = "Let Claude Code sessions on any host message each other through a small room server (client and server)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "leondgarse" }]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX", "Operating System :: MacOS"]

[project.urls]
Homepage = "https://github.com/leondgarse/switchboard"

[project.scripts]
room = "room:main"

[tool.setuptools]
py-modules = ["room", "room_server"]

[tool.setuptools.dynamic]
version = { attr = "room.__version__" }
