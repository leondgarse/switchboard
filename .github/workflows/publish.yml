name: Publish switchboard-room to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches room.__version__
        working-directory: room
        run: |
          v=$(python -c "import room; print(room.__version__)")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != room.__version__ $v"; exit 1; }
      - name: Build
        working-directory: room
        run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: room/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # must match the PyPI trusted publisher
    permissions:
      id-token: write          # trusted publishing (OIDC), no token secret
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
